<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 594" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="594" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">ISA 계좌 흐름 한눈에</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">중개형 기준</text><rect x="36" y="104" width="408" height="74" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/><text x="56" y="136" font-size="20" font-weight="700" fill="#1f2328">1. 가입</text><text x="56" y="162" font-size="16" fill="#5b6370">증권사 앱에서 중개형 ISA 개설</text><path d="M240 180 l0 14" stroke="#b8bec5" stroke-width="3"/><rect x="36" y="196" width="408" height="74" rx="12" fill="#ffffff" stroke="#a3c4b2" stroke-width="2"/><text x="56" y="228" font-size="20" font-weight="700" fill="#1f2328">2. 넣기</text><text x="56" y="254" font-size="16" fill="#5b6370">1년에 2,000만원까지, 못 채우면 다음 해로</text><path d="M240 272 l0 14" stroke="#b8bec5" stroke-width="3"/><rect x="36" y="288" width="408" height="74" rx="12" fill="#ffffff" stroke="#a3c4b2" stroke-width="2"/><text x="56" y="320" font-size="20" font-weight="700" fill="#1f2328">3. 굴리기</text><text x="56" y="346" font-size="16" fill="#5b6370">ETF·주식을 사고팔아도 세금은 나중에</text><path d="M240 364 l0 14" stroke="#b8bec5" stroke-width="3"/><rect x="36" y="380" width="408" height="74" rx="12" fill="#ffffff" stroke="#a3c4b2" stroke-width="2"/><text x="56" y="412" font-size="20" font-weight="700" fill="#1f2328">4. 3년 지나면</text><text x="56" y="438" font-size="16" fill="#5b6370">만기 해지하고 세금 정산</text><path d="M240 456 l0 14" stroke="#b8bec5" stroke-width="3"/><rect x="36" y="472" width="408" height="74" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/><text x="56" y="504" font-size="20" font-weight="700" fill="#1f2328">5. 연금으로 옮기기</text><text x="56" y="530" font-size="16" fill="#5b6370">60일 안에 옮기면 10% 추가 세액공제</text></svg>