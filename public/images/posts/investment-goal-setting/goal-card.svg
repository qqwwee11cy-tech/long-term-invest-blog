<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="560" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">투자 목표 한 장 적기 (예시)</text><text x="240" y="72" text-anchor="middle" font-size="16" fill="#5b6370">위에서부터 순서대로 채워 보세요</text><rect x="36" y="96" width="408" height="70" rx="10" fill="#ffffff" stroke="#d9dde3"/><circle cx="68" cy="131" r="16" fill="#1f7a4d"/><text x="68" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="98" y="126" font-size="15" fill="#5b6370">무엇을</text><text x="98" y="151" font-size="19" font-weight="700" fill="#1f2328">노후 생활비에 보탤 돈</text><rect x="36" y="180" width="408" height="70" rx="10" fill="#ffffff" stroke="#d9dde3"/><circle cx="68" cy="215" r="16" fill="#1f7a4d"/><text x="68" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="98" y="210" font-size="15" fill="#5b6370">언제까지</text><text x="98" y="235" font-size="19" font-weight="700" fill="#1f2328">20년 뒤 (55살)</text><rect x="36" y="264" width="408" height="70" rx="10" fill="#ffffff" stroke="#d9dde3"/><circle cx="68" cy="299" r="16" fill="#1f7a4d"/><text x="68" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="98" y="294" font-size="15" fill="#5b6370">얼마나</text><text x="98" y="319" font-size="19" font-weight="700" fill="#1f2328">1억원</text><rect x="36" y="348" width="408" height="70" rx="10" fill="#ffffff" stroke="#d9dde3"/><circle cx="68" cy="383" r="16" fill="#1f7a4d"/><text x="68" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text><text x="98" y="378" font-size="15" fill="#5b6370">매달 얼마</text><text x="98" y="403" font-size="19" font-weight="700" fill="#1f2328">약 24만원 (연 5% 가정)</text><rect x="36" y="432" width="408" height="70" rx="10" fill="#ffffff" stroke="#d9dde3"/><circle cx="68" cy="467" r="16" fill="#1f7a4d"/><text x="68" y="473" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text><text x="98" y="462" font-size="15" fill="#5b6370">어디에</text><text x="98" y="487" font-size="19" font-weight="700" fill="#1f2328">연금저축 계좌</text><text x="240" y="534" text-anchor="middle" font-size="15" fill="#5b6370">2번(기간)과 3번(금액)이 정해져야 4번이 나와요</text></svg>