<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="640" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">1억원을 모으려면 매달 얼마?</text><text x="240" y="72" text-anchor="middle" font-size="16" fill="#5b6370">기간이 길수록 매달 넣을 돈이 줄어요</text><rect x="36" y="92" width="16" height="16" rx="3" fill="#b9bec6"/><text x="60" y="106" font-size="15" fill="#1f2328">수익 0% (그냥 모으기)</text><rect x="250" y="92" width="16" height="16" rx="3" fill="#1f7a4d"/><text x="274" y="106" font-size="15" fill="#1f2328">연 5% 가정</text><text x="36" y="140" font-size="19" font-weight="700" fill="#1f2328">5년</text><rect x="36" y="150" width="408" height="26" rx="5" fill="#b9bec6"/><text x="444" y="140" text-anchor="end" font-size="16" fill="#5b6370">약 167만원 / <tspan font-weight="700" fill="#1f7a4d">약 147만원</tspan></text><rect x="36" y="182" width="360" height="26" rx="5" fill="#1f7a4d"/><text x="36" y="260" font-size="19" font-weight="700" fill="#1f2328">10년</text><rect x="36" y="270" width="204" height="26" rx="5" fill="#b9bec6"/><text x="444" y="260" text-anchor="end" font-size="16" fill="#5b6370">약 83만원 / <tspan font-weight="700" fill="#1f7a4d">약 64만원</tspan></text><rect x="36" y="302" width="158" height="26" rx="5" fill="#1f7a4d"/><text x="36" y="380" font-size="19" font-weight="700" fill="#1f2328">15년</text><rect x="36" y="390" width="136" height="26" rx="5" fill="#b9bec6"/><text x="444" y="380" text-anchor="end" font-size="16" fill="#5b6370">약 56만원 / <tspan font-weight="700" fill="#1f7a4d">약 37만원</tspan></text><rect x="36" y="422" width="92" height="26" rx="5" fill="#1f7a4d"/><text x="36" y="500" font-size="19" font-weight="700" fill="#1f2328">20년</text><rect x="36" y="510" width="102" height="26" rx="5" fill="#b9bec6"/><text x="444" y="500" text-anchor="end" font-size="16" fill="#5b6370">약 42만원 / <tspan font-weight="700" fill="#1f7a4d">약 24만원</tspan></text><rect x="36" y="542" width="60" height="26" rx="5" fill="#1f7a4d"/><text x="240" y="610" text-anchor="middle" font-size="15" fill="#5b6370">연 5%는 계산용 가정이고, 실제 수익은 해마다 달라요</text><text x="240" y="634" text-anchor="middle" font-size="15" fill="#5b6370">(월 복리, 세금·수수료 빼고 계산)</text></svg>