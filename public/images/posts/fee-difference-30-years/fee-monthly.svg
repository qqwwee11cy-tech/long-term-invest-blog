<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="440" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">매달 50만 원씩 30년</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">연 7% 가정, 넣은 돈 합계 1억 8,000만 원</text><text x="36" y="120" font-size="19" fill="#1f2328">총보수 0.1%</text><text x="444" y="120" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">5억 7,406만 원</text><rect x="36" y="130" width="408" height="32" rx="6" fill="#1f7a4d"/><text x="36" y="204" font-size="19" fill="#1f2328">총보수 0.6%</text><text x="444" y="204" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">5억 2,388만 원</text><rect x="36" y="214" width="372" height="32" rx="6" fill="#5e9e7e"/><text x="36" y="288" font-size="19" fill="#1f2328">총보수 1.5%</text><text x="444" y="288" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">4억 4,546만 원</text><rect x="36" y="298" width="317" height="32" rx="6" fill="#a3c4b2"/><text x="240" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a4d">0.5%p 차이(0.1% vs 0.6%): 약 5,018만 원</text><text x="240" y="420" text-anchor="middle" font-size="15" fill="#5b6370">세금 제외, 계산을 위한 가정</text></svg>