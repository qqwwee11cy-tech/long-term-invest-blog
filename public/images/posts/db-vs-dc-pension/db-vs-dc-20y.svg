<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 590" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="590" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">20년 다니고 받는 돈 비교</text><text x="240" y="72" text-anchor="middle" font-size="16" fill="#5b6370">가정: 첫 월급 300만원, 매년 3% 상승</text><text x="36" y="112" font-size="18" fill="#1f2328">DB형</text><text x="444" y="112" text-anchor="end" font-size="18" font-weight="700" fill="#1f2328">약 1억 521만원</text><rect x="36" y="122" width="306" height="30" rx="6" fill="#5b6370"/><text x="36" y="194" font-size="18" fill="#1f2328">DC형 연 2%</text><text x="444" y="194" text-anchor="end" font-size="18" font-weight="700" fill="#1f2328">약 9,605만원</text><rect x="36" y="204" width="280" height="30" rx="6" fill="#1f7a4d" fill-opacity="0.55"/><text x="36" y="276" font-size="18" fill="#1f2328">DC형 연 3%</text><text x="444" y="276" text-anchor="end" font-size="18" font-weight="700" fill="#1f2328">약 1억 521만원</text><rect x="36" y="286" width="306" height="30" rx="6" fill="#1f7a4d"/><text x="36" y="358" font-size="18" fill="#1f2328">DC형 연 4%</text><text x="444" y="358" text-anchor="end" font-size="18" font-weight="700" fill="#1f2328">약 1억 1,550만원</text><rect x="36" y="368" width="336" height="30" rx="6" fill="#1f7a4d"/><text x="36" y="440" font-size="18" fill="#1f2328">DC형 연 6%</text><text x="444" y="440" text-anchor="end" font-size="18" font-weight="700" fill="#1f2328">약 1억 4,010만원</text><rect x="36" y="450" width="408" height="30" rx="6" fill="#1f7a4d"/><line x1="342" y1="122" x2="342" y2="158" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="342" y1="204" x2="342" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="342" y1="286" x2="342" y2="322" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="342" y1="368" x2="342" y2="404" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="342" y1="450" x2="342" y2="486" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="240" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">3%보다 잘 굴리면 DC형이 더 많아요</text><text x="240" y="560" text-anchor="middle" font-size="15" fill="#5b6370">점선은 DB형 금액, 세금은 빼지 않은 단순 계산이에요</text></svg>