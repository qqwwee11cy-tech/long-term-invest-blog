<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="520" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">국내 상장 ETF, 세금은 이렇게</text><text x="240" y="72" text-anchor="middle" font-size="16" fill="#5b6370">일반 계좌 기준</text>
<rect x="28" y="92" width="424" height="160" rx="12" fill="#ffffff" stroke="#5b6370" stroke-width="1.5"/><text x="48" y="126" font-size="20" font-weight="700" fill="#1f2328">국내 주식형 ETF</text><text x="48" y="154" font-size="15" fill="#5b6370">예: 코스피200을 따라가는 ETF</text>
<text x="48" y="192" font-size="17" fill="#1f2328">분배금</text><text x="432" y="192" text-anchor="end" font-size="17" font-weight="700" fill="#1f2328">15.4%</text>
<text x="48" y="226" font-size="17" fill="#1f2328">팔아서 남긴 이익</text><text x="432" y="226" text-anchor="end" font-size="17" font-weight="700" fill="#1f2328">세금 없음</text>
<rect x="28" y="272" width="424" height="160" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/><text x="48" y="306" font-size="20" font-weight="700" fill="#1f7a4d">국내 상장 해외 ETF</text><text x="48" y="334" font-size="15" fill="#5b6370">예: 미국 S&amp;P 500을 따라가는 ETF</text>
<text x="48" y="372" font-size="17" fill="#1f2328">분배금</text><text x="432" y="372" text-anchor="end" font-size="17" font-weight="700" fill="#1f2328">15.4%</text>
<text x="48" y="406" font-size="17" fill="#1f2328">팔아서 남긴 이익</text><text x="432" y="406" text-anchor="end" font-size="17" font-weight="700" fill="#1f7a4d">15.4%</text>
<text x="240" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">해외 ETF는 이익도 배당소득으로 봐요</text><text x="240" y="496" text-anchor="middle" font-size="15" fill="#5b6370">그래서 금융소득 2,000만원 계산에도 들어가요</text></svg>
