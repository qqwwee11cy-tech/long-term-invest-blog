<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 388" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="388" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">환율이 수익률을 바꾸는 예</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">가정: 1년 동안 주가 +10%, 환율 -10%</text><text x="36" y="118" font-size="19" fill="#1f2328">달러로 본 주가</text><text x="444" y="118" text-anchor="end" font-size="19" font-weight="700" fill="#1f7a4d">+10%</text><rect x="36" y="128" width="340" height="32" rx="6" fill="#1f7a4d"/><text x="36" y="198" font-size="19" fill="#1f2328">환율 변화</text><text x="444" y="198" text-anchor="end" font-size="19" font-weight="700" fill="#c0392b">-10%</text><rect x="36" y="208" width="340" height="32" rx="6" fill="#c0392b"/><text x="36" y="278" font-size="19" fill="#1f2328">원화로 본 결과</text><text x="444" y="278" text-anchor="end" font-size="19" font-weight="700" fill="#c0392b">-1%</text><rect x="36" y="288" width="34" height="32" rx="6" fill="#c0392b"/><text x="240" y="368" text-anchor="middle" font-size="15" fill="#5b6370">1.10 × 0.90 = 0.99</text></svg>