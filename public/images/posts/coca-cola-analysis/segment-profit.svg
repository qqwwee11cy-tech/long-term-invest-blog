<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 570" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="570" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">코카콜라 부문별 영업이익</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">2025년, 단위 달러 (괄호는 영업이익률)</text><text x="36" y="118" font-size="19" fill="#1f2328">북미</text><text x="444" y="118" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">50.7억 (25.9%)</text><rect x="36" y="128" width="408" height="32" rx="6" fill="#a3c4b2"/><text x="36" y="198" font-size="19" fill="#1f2328">유럽·중동·아프리카</text><text x="444" y="198" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">43억 (37.3%)</text><rect x="36" y="208" width="346" height="32" rx="6" fill="#a3c4b2"/><text x="36" y="278" font-size="19" fill="#1f2328">중남미</text><text x="444" y="278" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">37.4억 (59.1%)</text><rect x="36" y="288" width="301" height="32" rx="6" fill="#1f7a4d"/><text x="36" y="358" font-size="19" fill="#1f2328">아시아·태평양</text><text x="444" y="358" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">20.4억 (36.2%)</text><rect x="36" y="368" width="164" height="32" rx="6" fill="#a3c4b2"/><text x="36" y="438" font-size="19" fill="#1f2328">병입 사업</text><text x="444" y="438" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">4.3억 (7.4%)</text><rect x="36" y="448" width="34" height="32" rx="6" fill="#a3c4b2"/><text x="240" y="546" text-anchor="middle" font-size="15" fill="#5b6370">출처: 코카콜라 2025년 연간 실적 발표</text></svg>