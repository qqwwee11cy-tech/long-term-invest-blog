<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="480" height="560" rx="16" fill="#fbfaf7"/>
