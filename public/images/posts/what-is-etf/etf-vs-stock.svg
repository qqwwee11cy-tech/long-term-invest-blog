le" font-size="19" fill="#1f2328">보험</text><rect x="348" y="446" width="96" height="48" rx="8" fill="#e6f2ec" stroke="#1f7a4d" stroke-width="1.5"/><text x="396" y="477" text-anchor="middle" font-size="19" fill="#1f2328">식품</text>
