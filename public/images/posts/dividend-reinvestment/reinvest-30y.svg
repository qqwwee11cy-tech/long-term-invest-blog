<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="410" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">1,000만 원을 30년 두면</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">주가 연 5% 상승, 배당 연 3% 가정</text><text x="36" y="124" font-size="19" fill="#1f2328">배당을 다시 투자</text><text x="444" y="124" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">1억 63만 원</text><rect x="36" y="134" width="408" height="32" rx="6" fill="#1f7a4d"/><text x="36" y="220" font-size="19" fill="#1f2328">배당을 꺼내 씀 (합계)</text><text x="444" y="220" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">6,315만 원</text><rect x="36" y="230" width="256" height="32" rx="6" fill="#b8bec5"/><text x="36" y="336" font-size="16" fill="#5b6370">꺼내 쓴 경우: 평가금 4,322만 + 배당 1,993만</text><text x="240" y="390" text-anchor="middle" font-size="15" fill="#5b6370">세금 제외, 계산을 위한 가정</text></svg>