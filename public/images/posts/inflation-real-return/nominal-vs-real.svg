<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="470" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">1,000만원을 30년 굴리면</text><text x="240" y="72" text-anchor="middle" font-size="17" fill="#5b6370">가정: 연 수익률 6%, 물가 매년 2.5%</text><text x="36" y="118" font-size="19" fill="#1f2328">처음 넣은 돈</text><text x="444" y="118" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">약 1,000만원</text><rect x="36" y="128" width="71" height="32" rx="6" fill="#5b6370"/><text x="36" y="206" font-size="19" fill="#1f2328">30년 뒤 통장에 찍힌 돈</text><text x="444" y="206" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">약 5,743만원</text><rect x="36" y="216" width="408" height="32" rx="6" fill="#1f7a4d"/><text x="36" y="294" font-size="19" fill="#1f2328">오늘 돈 가치로 바꾸면</text><text x="444" y="294" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">약 2,738만원</text><rect x="36" y="304" width="195" height="32" rx="6" fill="#1f7a4d" fill-opacity="0.55"/><text x="240" y="388" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a4d">숫자는 5.7배, 실제 살 수 있는 건 2.7배</text><text x="240" y="422" text-anchor="middle" font-size="15" fill="#5b6370">세금·수수료는 빼지 않은 단순 계산이에요</text></svg>