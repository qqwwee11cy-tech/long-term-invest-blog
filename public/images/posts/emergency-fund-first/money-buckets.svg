<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect width="480" height="560" rx="16" fill="#fbfaf7"/><text x="240" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">돈을 세 칸으로 나누기</text><rect x="36" y="96" width="408" height="112" rx="12" fill="#eef0f2"/><text x="240.0" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">① 생활비 통장</text><text x="240.0" y="166" text-anchor="middle" font-size="17" fill="#1f2328">이번 달 쓸 돈</text><text x="240.0" y="190" text-anchor="middle" font-size="17" fill="#1f2328">월급이 들어오는 곳</text><text x="240" y="232" text-anchor="middle" font-size="22" fill="#5b6370">↓</text><rect x="36" y="244" width="408" height="112" rx="12" fill="#e6f2ec"/><text x="240.0" y="284" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">② 비상금</text><text x="240.0" y="314" text-anchor="middle" font-size="17" fill="#1f2328">생활비 3~6개월치</text><text x="240.0" y="338" text-anchor="middle" font-size="17" fill="#1f2328">언제든 꺼낼 수 있는 곳에</text><text x="240" y="380" text-anchor="middle" font-size="22" fill="#5b6370">↓</text><rect x="36" y="392" width="408" height="112" rx="12" fill="#1f7a4d"/><text x="240.0" y="432" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">③ 투자금</text><text x="240.0" y="462" text-anchor="middle" font-size="17" fill="#ffffff">5년 이상 안 쓸 돈</text><text x="240.0" y="486" text-anchor="middle" font-size="17" fill="#ffffff">오래 묵혀둘 곳에</text><text x="240" y="540" text-anchor="middle" font-size="15" fill="#5b6370">위 칸이 채워진 다음 아래 칸으로</text></svg>